<app-resource-representation-container height="auto">
  <div appDisableContextMenu>
    @if (videoError) {
    <app-representation-error-message />
    }

    <div class="video-stage" [class.is-loading]="!isMetadataLoaded && !videoError">
      @if (video) {
      <video
        style="width: 100%"
        #videoElement
        id="video"
        [src]="video"
        type="video/mp4"
        preload="auto"
        [muted]="false"
        (loadedmetadata)="onMetadataLoaded()"
        (canplay)="onVideoPlayerReady()"
        (click)="videoPlayer.togglePlay()"
        (error)="handleVideoError($event)"></video>
      }
      <!-- Overlaid rather than swapped in: the <video> element must stay mounted while it
           initialises, otherwise the browser stops loading it. See DEV-7026. -->
      @if (!isMetadataLoaded && !videoError) {
      <div class="video-loading" data-cy="video-loading">
        <app-progress-indicator size="medium" [compact]="true" [onDark]="true" />
      </div>
      } @if (false) {
      <app-video-overlay />
      }
    </div>

    @if (isMetadataLoaded) {
    <app-media-slider
      [max]="videoPlayer.duration()"
      [currentTime]="myCurrentTime"
      (afterNavigation)="videoPlayer.navigate($event)" />
    } @if (segmentsService.segments.length > 0 && duration > 0) {
    <app-segments-display [segments]="segmentsService.segments" [videoLengthSecs]="duration" />
    } @if (fileInfo && isPlayerReady) {
    <app-video-toolbar
      [src]="src"
      [parentResource]="parentResource"
      [fileInfo]="fileInfo"
      (toggleCinemaMode)="toggleCinemaMode()" />
    }
  </div>
</app-resource-representation-container>
