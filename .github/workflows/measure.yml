# Temporary: Phase 10's end-of-plan measurements with the spike's method (DEV-7767). Deleted by the
# next commit; the numbers live in docs/contribution/bazel-baselines.md.
name: Measure
on:
  push:
    branches: [feature/dev-7767-bazelify-dsp-app-replace-nx-with-bazel-as-the-build-system]
    paths: [.github/workflows/measure.yml]
permissions:
  contents: read
jobs:
  local:
    name: Cold, warm, edit, no remote or disk cache (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Measure
        run: |
          set -uo pipefail
          nix develop --command true
          B="nix develop --command bazel"
          stamp() { date +%s.%N; }
          ( peak=0; while true; do u=$(free -m | awk '/^Mem:/{print $3}'); if [ "$u" -gt "$peak" ]; then peak=$u; echo "$peak" > /tmp/peak; fi; sleep 2; done ) &
          mem=$!
          t0=$(stamp); $B build //apps/dsp-app:dist --lockfile_mode=error --profile=/tmp/cold.json.gz; rc=$?; t1=$(stamp)
          kill "$mem"
          echo "cold_rc=$rc cold_s=$(echo "$t1-$t0" | bc) peak_used_mb=$(cat /tmp/peak) nproc=$(nproc) mem_total_mb=$(free -m | awk '/^Mem:/{print $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - /tmp/cold.json.gz <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import gzip, json, sys
          ev = [e for e in json.load(gzip.open(sys.argv[1]))["traceEvents"] if e.get("ph") == "X" and "dur" in e]
          acts = {}
          for e in ev:
              n = e.get("name", "")
              if e.get("cat") in ("action processing", "complete action execution"):
                  acts[n] = max(acts.get(n, 0), e["dur"] / 1e6)
          ts = [(v, k) for k, v in acts.items() if k.startswith("Compiling Angular TS") or k.startswith("Compiling TS") or "TsProject" in k]
          es = [(v, k) for k, v in acts.items() if "esbuild" in k.lower() or k.startswith("Bundling")]
          print(f"compile_actions={len(ts)} compile_sum_s={sum(v for v, _ in ts):.1f}")
          for v, k in sorted(ts, reverse=True)[:5]: print(f"  {v:6.1f}s {k[:100]}")
          for v, k in sorted(es, reverse=True)[:3]: print(f"esbuild {v:6.1f}s {k[:100]}")
          EOF
          t0=$(stamp); $B build //apps/dsp-app:dist; t1=$(stamp); echo "warm_noop_server_running_s=$(echo "$t1-$t0" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          $B shutdown
          t0=$(stamp); $B build //apps/dsp-app:dist; t1=$(stamp); echo "warm_noop_after_restart_s=$(echo "$t1-$t0" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          T=$(git grep -l "template: \`" -- 'libs/vre/ui/ui/src/lib/*.component.ts' | head -1)
          sed -i "0,/template: \`/s//template: \`<!-- edit -->/" "$T"
          t0=$(stamp); $B build //apps/dsp-app:dist; t1=$(stamp); echo "one_line_edit_s=$(echo "$t1-$t0" | bc) file=$T" | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -- libs
          exit $rc

  remote:
    name: Remote execution, nothing accepted from the remote cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: measure-empty-${{ github.run_id }}
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Measure
        env:
          FLAGS: ${{ steps.bazel.outputs.flags }}
        run: |
          set -uo pipefail
          nix develop --command true
          stamp() { date +%s.%N; }
          t0=$(stamp)
          nix develop --command bazel build //apps/dsp-app:dist $FLAGS --noremote_accept_cached \
            --build_event_json_file="$RUNNER_TEMP/bep-remote.json" --execution_log_json_file="$RUNNER_TEMP/exec-remote.json"
          rc=$?; t1=$(stamp)
          echo "remote_exec_rc=$rc remote_exec_s=$(echo "$t1-$t0" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[.mnemonic, .runner] | @tsv' "$RUNNER_TEMP/exec-remote.json" | sort | uniq -c | sort -rn | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'select(.buildMetrics) | .buildMetrics.actionSummary' "$RUNNER_TEMP/bep-remote.json" | tee -a "$GITHUB_STEP_SUMMARY"
          nix develop --command bazel clean
          t0=$(stamp)
          nix develop --command bazel build //apps/dsp-app:dist $FLAGS --disk_cache= --build_event_json_file="$RUNNER_TEMP/bep-cached.json"
          t1=$(stamp)
          echo "remote_cache_cold_output_base_s=$(echo "$t1-$t0" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'select(.buildMetrics) | .buildMetrics.actionSummary' "$RUNNER_TEMP/bep-cached.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measure-remote
          path: |
            ${{ runner.temp }}/bep-remote.json
            ${{ runner.temp }}/exec-remote.json
            ${{ runner.temp }}/bep-cached.json
