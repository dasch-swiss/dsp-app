name: OpenAPI sync

# Compares the vendored dsp-api spec with the dev API's, so its result follows dev, not the commit:
# feature-branch pushes do not run it. main's run opens the spec-bump PRs; the schedule catches
# drift while main is quiet.
on:
  push:
    branches:
      - main
      - 'chore/update-dsp-api-openapi-spec-*'
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

# One run per ref at a time, so two main runs cannot both open a spec-bump PR.
concurrency:
  group: openapi-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:

  check-openapi-sync:
    name: Check OpenAPI Spec is Up-to-Date
    runs-on: ubuntu-latest
    # The App token pushes and calls gh; GITHUB_TOKEN only checks out.
    permissions:
      contents: read
    steps:
      # Mint a short-lived GitHub App token (DaSCH Bot App) scoped to dsp-app.
      # Only the PR step gets it, for `git push` (as the App, not the built-in
      # GITHUB_TOKEN) and `gh`; the checkout persists no credentials, so the
      # build steps before it never see a token. Pushes made with an App
      # token DO trigger the `on: push` CI that produces the required checks;
      # GITHUB_TOKEN pushes are suppressed by GitHub's recursion guard, which
      # left those checks unreported and the spec-bump PRs permanently BLOCKED.
      # SHA-pinned (v3 == bcd2ba4) since this action handles private-key material.
      - name: Mint App token (write — dsp-app only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          app-id: ${{ secrets.DASCH_BOT_APP_ID }}
          private-key: ${{ secrets.DASCH_BOT_APP_PRIVATE_KEY }}
          owner: dasch-swiss
          repositories: dsp-app
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - id: check
        name: Run OpenAPI sync check
        run: |
          set +e
          nix develop --command just openapi-check --verbose
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 2 ]; then
            echo "::warning::Failed to download spec after retries — DEV server may be unavailable."
            exit 0
          fi
          exit $exit_code
      - name: Update OpenAPI spec
        if: always() && steps.check.outputs.exit_code == '1'
        run: nix develop --command just openapi-update
      - name: Create PR if spec changed
        if: always() && steps.check.outputs.exit_code == '1'
        run: |
          if git diff --quiet; then
            echo "No spec changes after update — skipping PR creation."
            exit 0
          fi
          SPEC="libs/vre/3rd-party-services/open-api/dsp-api_spec.yaml"
          gh auth setup-git
          git fetch origin main
          LOCAL_VERSION=$(git show origin/main:"$SPEC" | yq '.info.version')
          REMOTE_VERSION=$(yq '.info.version' "$SPEC")
          if [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
            echo "Spec changed but version is unchanged (${REMOTE_VERSION}) — skipping PR creation."
            exit 0
          fi
          PR_TITLE="chore(open-api): bump dsp-api spec ${LOCAL_VERSION} → ${REMOTE_VERSION}"
          # Dedup on the bot's branch namespace, NOT the exact title. The title
          # embeds the full `git describe` version (e.g. v35.10.0-13-g4349516);
          # any new dsp-api commit changes that suffix, so a title-exact check
          # spawns a fresh PR every time DEV drifts while a bump PR is still open
          # (e.g. #3153 then #3154 when a dsp-api release landed between two CI
          # runs). Allow at most ONE open spec-bump PR; once it merges/closes the
          # next run picks up the latest DEV version.
          EXISTING=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/update-dsp-api-openapi-spec-"))] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open dsp-api spec-bump PR already exists — skipping (it will be superseded once merged/closed)."
            exit 0
          fi
          # Commit as the App's bot identity. GitHub's noreply email format is
          # <bot-user-id>+<slug>[bot]@users.noreply.github.com (bot-user-id is the
          # numeric user id, NOT the App id); resolved dynamically so a future App
          # rename can't silently break attribution.
          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          MANIFEST="tools/openapi/openapi_files.bzl"
          cp "$SPEC" /tmp/updated-spec.yaml
          BRANCH="chore/update-dsp-api-openapi-spec-$(date +%Y%m%d-%H%M%S)"
          # -f discards openapi-update's working-tree edits: the PR holds only the spec and main's
          # generated manifest.
          git checkout -f -b "$BRANCH" origin/main
          cp /tmp/updated-spec.yaml "$SPEC"
          nix develop --command just openapi-generate
          git add "$SPEC" "$MANIFEST"
          git commit -m "chore(open-api): bump dsp-api spec ${LOCAL_VERSION} → ${REMOTE_VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "${PR_TITLE}" \
            --body "Automated spec update detected by CI. Auto-merges once the required checks pass; a breaking change the APP uses fails compilation and blocks the merge." \
            --label "dependencies" \
            --label "dsp-api" \
            --base main
          # Enable auto-merge: the PR squash-merges itself once required checks
          # are green and the required review is in place. The review comes from
          # the auto-approve-bots workflow, which approves bot PRs that have
          # auto-merge armed. The App's bypass allowance on main does NOT cover
          # this: bypass applies to an explicit merge by that actor, while queued
          # auto-merge waits for every required condition, reviews included.
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            echo "::error::No open PR found for branch ${BRANCH} after create."
            exit 1
          fi
          # Enabling auto-merge immediately after `gh pr create` often fails
          # while GitHub is still computing mergeability (mergeable: UNKNOWN),
          # which previously left the PR needing a manual click. Retry until it
          # sticks. Arming it here is also what tells auto-approve-bots that this
          # PR is meant to merge unattended.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto --squash "$PR_URL"; then
              echo "Auto-merge enabled (attempt ${attempt})."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::warning::Could not enable auto-merge after ${attempt} attempts; current state:"
              gh pr view "$PR_URL" --json autoMergeRequest --jq .autoMergeRequest || true
            else
              echo "Enabling auto-merge failed (attempt ${attempt}); retrying in 10s…"
              sleep 10
            fi
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
