name: CI

on: [ push ]

# Prevent wasting resources by canceling in-progress runs when a new run is triggered
# on the same branch. main is exempt: cancelling it mid-upload leaves a pixeleye
# build that never completes, and every later build queues behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      automation_skip: ${{ steps.detect.outputs.automation_skip }}
      only_workflows: ${{ steps.detect.outputs.only_workflows }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      bot_push: ${{ steps.detect.outputs.bot_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # shallow; depth-2 covers merge-base for branches off latest main
      - id: detect
        # Pass GitHub context via `env:` (NOT inline `${{ ... }}` in the script
        # body) — inline interpolation is a documented shell-injection vector:
        # a crafted commit message could break out of the string. Inside bash,
        # references are normal `$VAR` expansions and are safe.
        # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.username }}
          GH_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # bot_push: a bot pushed to a feature branch (Renovate, dasch-bot-app
          # incl. the OpenAPI spec-bump PRs). Used to skip pixeleye capture —
          # bot updates don't need a visual review. main is never skipped so
          # the baseline stays complete.
          bot_push="false"
          if [ "$GH_REF" != "refs/heads/main" ]; then
            case "$ACTOR" in
              renovate\[bot\]|dasch-bot-app\[bot\]) bot_push="true" ;;
            esac
            case "$GH_REF" in
              refs/heads/renovate/*|refs/heads/chore/update-dsp-api-openapi-spec-*) bot_push="true" ;;
            esac
          fi
          echo "bot_push=$bot_push" >> "$GITHUB_OUTPUT"

          # Existing daschbot / release-please skip — consolidated.
          # COMMIT_MSG / COMMIT_AUTHOR are empty on PR events (not used by ci.yml
          # today, but defensively preserved). Empty strings don't match either
          # pattern, so automation_skip=false — same outcome as the prior
          # null-guard (head_commit == null || !startsWith(...)).
          if [[ "$COMMIT_MSG" == "chore(main): release"* || "$COMMIT_AUTHOR" == "daschbot" ]]; then
            echo "automation_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "automation_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # Tag and direct-main pushes: full pipeline (no path-based skip).
          if [[ "$GH_REF" == refs/tags/* ]] || [ "$GH_REF" = "refs/heads/main" ]; then
            echo "only_workflows=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Feature branch push: fetch main and three-dot-diff.
          # No --depth on the fetch — the merge-base may be far back in main's
          # history; --depth=1 would silently break for any branch even slightly
          # behind main. Cost: a few seconds, runs once per CI invocation.
          if ! git fetch --no-tags origin main 2>/dev/null; then
            echo "::warning::could not fetch origin/main; running full pipeline"
            echo "only_workflows=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
          if [ -z "$DIFF" ]; then
            # No diff (rare for push events) — fail-safe.
            echo "only_workflows=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # only_workflows: every changed file is under .github/workflows/
          if echo "$DIFF" | grep -qv '^\.github/workflows/'; then
            only_workflows="false"
          else
            only_workflows="true"
          fi

          # Author-based override: only bot-authored workflow-only PRs
          # benefit from the skip. Human edits to workflow files often
          # change job logic that needs validating in the same PR — force
          # the full pipeline so the change is exercised.
          if [ "$only_workflows" = "true" ]; then
            case "$COMMIT_AUTHOR" in
              renovate*|dependabot*) ;;       # bot — keep skip
              *) only_workflows="false" ;;    # human — force full pipeline
            esac
          fi

          echo "only_workflows=$only_workflows" >> "$GITHUB_OUTPUT"

          # docs_only: every changed file is on a list of paths the built app never reads, so E2E
          # skips. An allow-list, not "nothing under apps/ or libs/": the lockfile, MODULE.bazel,
          # the justfile, flake.nix, tools/ and .storybook all change what E2E runs against.
          if echo "$DIFF" | grep -qvE '^(docs/|k6/|\.claude/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: DSP-APP Linting
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-lint
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run lint
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-lint.json
        run: nix develop --command just lint
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-lint
          path: ${{ runner.temp }}/bep-*.json
          if-no-files-found: ignore

  test:
    name: DSP-APP Unit tests
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-test
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run test
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-test.json --execution_log_json_file=${{ runner.temp }}/exec.json
        run: nix develop --command just test
      - name: Count actions by mnemonic and runner
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/exec.json" ]; then
            echo "no execution log; Bazel stopped before running actions"
            exit 0
          fi
          jq -r '[.mnemonic, .runner, (.exitCode // 0)] | @tsv' "$RUNNER_TEMP/exec.json" | sort | uniq -c
          echo "TsProject actions by target:"
          jq -r 'select(.mnemonic == "TsProject") | [.targetLabel, .runner, (.exitCode // 0)] | @tsv' "$RUNNER_TEMP/exec.json" | sort
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-test
          path: |
            ${{ runner.temp }}/bep-*.json
            ${{ runner.temp }}/exec.json
          if-no-files-found: ignore

  dsp-app-e2e-tests:
    name: DSP-APP E2E tests (${{ matrix.runner }})
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false' &&
      needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Run all runners to completion even if one fails, so all failures are visible
      fail-fast: false
      matrix:
        include:
          # Heavy runner: resource.cy.ts (many API requests per test), data-model-class.cy.ts (DB reset per test), plus smaller specs to balance load
          - runner: heavy
            specs: cypress/e2e/system-admin/resource.cy.ts,cypress/e2e/system-admin/data-model-class.cy.ts,cypress/e2e/system-admin/still-image.cy.ts,cypress/e2e/system-admin/file-representation.cy.ts
          # Rest runner: remaining specs
          - runner: rest
            specs: cypress/e2e/system-admin/resource-edit-preserves-view.cy.ts,cypress/e2e/system-admin/ontology.cy.ts,cypress/e2e/system-admin/projects.cy.ts,cypress/e2e/system-admin/lists.cy.ts,cypress/e2e/system-admin/project-members.cy.ts,cypress/e2e/system-admin/project-overview.cy.ts,cypress/e2e/system-admin/image-settings.cy.ts,cypress/e2e/project-member/**/*.cy.ts,cypress/e2e/logged-out-user/**/*.cy.ts,cypress/e2e/performance/**/*.cy.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-e2e-${{ matrix.runner }}
          cypress: 'true'
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      # .bazelignore keeps this checkout out of the dsp-app workspace.
      - name: Checkout DSP-API repo
        uses: actions/checkout@v7
        with:
          repository: dasch-swiss/dsp-api
          ref: main
          path: dsp-api
          persist-credentials: false
      # The install, type-check and build below run while the stack starts; `Wait for the API`
      # joins it before Cypress. A background process outlives its step, not its job.
      - name: Start the API in the background
        env:
          DSP_API_DIR: dsp-api
        run: |
          (rc=0; nix develop .#e2e --command just e2e-stack-start || rc=$?; echo "$rc" >"$RUNNER_TEMP/e2e-stack.status") \
            </dev/null >"$RUNNER_TEMP/e2e-stack.log" 2>&1 &
      - name: Type-check e2e specs
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-e2e-typecheck.json
        run: nix develop .#e2e --command just typecheck-e2e
      - name: Build the app
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-e2e-build.json
        run: nix develop .#e2e --command just build //apps/dsp-app:dist
      - name: Wait for the API
        env:
          DSP_API_DIR: dsp-api
        run: |
          status_file="$RUNNER_TEMP/e2e-stack.status"
          for _ in $(seq 300); do [ ! -f "$status_file" ] || break; sleep 2; done
          echo "::group::just e2e-stack-start"
          cat "$RUNNER_TEMP/e2e-stack.log"
          echo "::endgroup::"
          [ -f "$status_file" ] || { echo "::error::just e2e-stack-start did not finish within 10 minutes"; exit 1; }
          [ "$(cat "$status_file")" = 0 ] || { echo "::error::just e2e-stack-start failed"; exit 1; }
          nix develop .#e2e --command just e2e-stack-wait
      - name: Run e2e tests
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-e2e.json
          SPECS: ${{ matrix.specs }}
        run: nix develop .#e2e --command just e2e "$SPECS"
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-e2e-${{ matrix.runner }}
          path: ${{ runner.temp }}/bep-*.json
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-snapshots-${{ matrix.runner }}
          path: apps/dsp-app/cypress/fixtures/screenshots
      - name: Check Docker Container Logs
        if: failure()
        run: |
          docker ps
          docker ps -q | xargs -I {} docker logs {}

  dsp-app-e2e-tests-status:
    name: DSP-APP E2E tests
    needs: [changes, dsp-app-e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI integrity and aggregate matrix result
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job failed (${{ needs.changes.result }}); refusing to report green"
            exit 1
          fi
          result="${{ needs.dsp-app-e2e-tests.result }}"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "One or more e2e matrix runners failed (result: $result)"
            exit 1
          fi

  storybook-tests:
    name: Storybook Interaction Tests
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-storybook
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Build Storybook
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-storybook-build.json
        run: nix develop --command just storybook-build
      - name: Run interaction tests
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-storybook-test.json
        run: nix develop --command just storybook-test
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-storybook
          path: ${{ runner.temp }}/bep-*.json
          if-no-files-found: ignore

  pixeleye:
    name: Pixeleye Snapshots
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false' &&
      needs.changes.outputs.bot_push == 'false'
    # The pixeleye CLI bundles Playwright 1.59.0, which cannot install its OS dependencies on
    # ubuntu-26.04, the image ubuntu-latest moved to. Unpin when the CLI's Playwright supports it.
    runs-on: ubuntu-24.04
    # Capture only: this job uploads snapshots and never decides anything. The
    # verdict reaches the PR as the commit status `Pixeleye – dasch-swiss/dsp-app`,
    # posted by the pixeleye GitHub App and updated the moment a build is approved
    # (DEV-7471). Never re-run this job to refresh that status: it uploads a NEW
    # build for the same SHA, which is `unreviewed` again and discards the
    # approval. continue-on-error guards infrastructure failure (VM down, expired
    # token); the CLI exits 0 on every verdict, so a visual diff never fails it.
    continue-on-error: true
    outputs:
      uploaded: ${{ steps.capture.outputs.uploaded }}
    timeout-minutes: 30
    # A concurrency group holds one running + one pending job; a newly queued
    # job cancels the pending one regardless of cancel-in-progress. main gets
    # its own group so a PR job can never bump its baseline build (PR #3527's
    # merge lost its build that way). Cost: at most one main + one PR upload
    # hit the VM at once.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'pixeleye-main' || 'pixeleye-shared-vm' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history required: the CLI resolves baselines with
          # `git log -n 128` and `git merge-base HEAD <targetBranch>`.
          fetch-depth: 0
      - name: Fetch main for merge-base
        # `git merge-base HEAD main` cannot resolve `origin/main`, so main must
        # exist as a local ref. Skipped on main itself, where the fetch would
        # fail with "refusing to fetch into current branch".
        if: github.ref_name != 'main'
        run: git fetch origin main:main || echo "::warning::could not fetch main; baseline may fall back to latest build on the base branch"
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-pixeleye
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      # actions/cache rejects a path containing `..`, and a job's `env:` cannot read runner.temp.
      - name: Point Pixeleye's browsers at the runner's temp directory
        run: echo "PIXELEYE_BROWSERS_PATH=$RUNNER_TEMP/pixeleye-browsers" >> "$GITHUB_ENV"
      - name: Cache Pixeleye's browsers
        # The frozen CLI downloads Playwright 1.59.0's browsers on every start, and the headless
        # shell the capture launches goes there too; `just pixeleye` points both at this directory.
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXELEYE_BROWSERS_PATH }}
          key: pixeleye-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pixeleye-browsers-${{ runner.os }}-
      - name: Capture and upload snapshots
        id: capture
        run: |
          nix develop --command just pixeleye
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-pixeleye.json
          PIXELEYE_TOKEN: ${{ secrets.PIXELEYE_TOKEN }}
          PIXELEYE_ENDPOINT: ${{ vars.PIXELEYE_ENDPOINT }}
      # Breakpoint run: the `Pages / Breakpoints / …` stories at every breakpoint
      # width (pixeleye.breakpoints.config.ts), uploaded to their own pixeleye
      # project. Its status is informational, not a required check. These steps
      # live in this job, not a job of their own, so they hold the same
      # `pixeleye-shared-vm` slot: a second job would wait in the group, and a
      # pending job there is cancelled as soon as another branch queues one.
      # continue-on-error keeps a breakpoint failure from touching the main run.
      - name: Check breakpoint token
        id: breakpoints-token
        run: |
          if [ -z "$PIXELEYE_BREAKPOINTS_TOKEN" ]; then
            echo "::notice::PIXELEYE_BREAKPOINTS_TOKEN is not set; skipping breakpoint snapshots"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PIXELEYE_BREAKPOINTS_TOKEN: ${{ secrets.PIXELEYE_BREAKPOINTS_TOKEN }}
      - name: Capture and upload breakpoint snapshots
        if: steps.breakpoints-token.outputs.present == 'true'
        continue-on-error: true
        run: nix develop --command just pixeleye breakpoints
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }} --build_event_json_file=${{ runner.temp }}/bep-pixeleye-breakpoints.json
          PIXELEYE_BREAKPOINTS_TOKEN: ${{ secrets.PIXELEYE_BREAKPOINTS_TOKEN }}
          PIXELEYE_ENDPOINT: ${{ vars.PIXELEYE_ENDPOINT }}
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-pixeleye
          path: ${{ runner.temp }}/bep-*.json
          if-no-files-found: ignore
      # A cancelled run (a newer push to the branch) SIGKILLs the CLI before its
      # own abort-on-signal handler runs: bash holds the signal until pnpm exits.
      # The build it created stays `uploading`, and pixeleye's stuck-build job
      # fails it without releasing the builds that target it (upstream bug), so
      # every later build of the branch sits in `queued-processing` forever.
      # Aborting it here releases them.
      - name: Abort unfinished pixeleye builds
        if: cancelled()
        run: |
          for token in "$PIXELEYE_TOKEN" "$PIXELEYE_BREAKPOINTS_TOKEN"; do
            [ -n "$token" ] || continue
            curl -sf -X POST "$PIXELEYE_ENDPOINT/v1/client/builds" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              -d "{\"shas\":[\"$GITHUB_SHA\"]}" \
              | jq -r '.[] | select(.status == "uploading" or .status == "queued-uploading") | .id' \
              | while read -r id; do
                  echo "Aborting pixeleye build $id"
                  curl -sf -X POST "$PIXELEYE_ENDPOINT/v1/client/builds/$id/abort" \
                    -H "Authorization: Bearer $token" -o /dev/null || echo "::warning::could not abort pixeleye build $id"
                done
          done
        env:
          PIXELEYE_TOKEN: ${{ secrets.PIXELEYE_TOKEN }}
          PIXELEYE_BREAKPOINTS_TOKEN: ${{ secrets.PIXELEYE_BREAKPOINTS_TOKEN }}
          PIXELEYE_ENDPOINT: ${{ vars.PIXELEYE_ENDPOINT }}

  pixeleye-status-fallback:
    # The pixeleye app only posts its status for a commit it received snapshots
    # for. When none were uploaded — capture skipped (release-please, bot
    # pushes, bot workflow-only PRs) or pixeleye unreachable — post a green status under the
    # app's context, or a required `Pixeleye – dasch-swiss/dsp-app` check would
    # stay pending forever and block the PR. Failing open on an unreachable
    # instance is deliberate: one VM with a known DB-pool wedge must not block
    # every merge. The required check must accept any source, not only the app.
    name: Pixeleye Status Fallback
    needs: [changes, pixeleye]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report status when no snapshots were uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CAPTURE_RESULT: ${{ needs.pixeleye.result }}
          UPLOADED: ${{ needs.pixeleye.outputs.uploaded }}
          # Must match the app's context exactly — note the en dash.
          CONTEXT: 'Pixeleye – dasch-swiss/dsp-app'
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job failed (${CHANGES_RESULT}); refusing to report green"
            exit 1
          fi
          if [ "$UPLOADED" = "true" ]; then
            echo "Snapshots uploaded; the pixeleye app reports the verdict itself."
            exit 0
          fi
          if [ "$CAPTURE_RESULT" = "skipped" ]; then
            DESC="Skipped for this commit — no snapshots taken"
          else
            DESC="Pixeleye unreachable — this commit has no visual coverage"
            echo "::warning::${DESC}"
          fi
          gh api -X POST "repos/${REPO}/statuses/${SHA}" \
            -f state=success -f context="$CONTEXT" -f description="$DESC" -f target_url="$RUN_URL" >/dev/null
          echo "Posted '${CONTEXT}': ${DESC}"

  gate:
    name: Gate (just ci)
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Nix, the Bazel caches and RBE
        id: bazel
        uses: ./.github/actions/bazel-setup
        with:
          cache-key-prefix: bazel-disk-gate
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      # No build event log: these recipes call Bazel many times, and the visibility check's seeds
      # fail on purpose, so one log would hold only the last seed's analysis.
      - name: Run just ci
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }}
        run: nix develop --command just ci
      - name: Check that just lint rejects a seeded violation
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }}
        run: nix develop --command just lint-selftest
      # The image has no HEALTHCHECK; ops-deploy's compose healthcheck runs curl inside the
      # container, so a base digest without curl must fail here, not in production.
      - name: Smoke-test the image
        env:
          BAZEL_FLAGS: ${{ steps.bazel.outputs.flags }}
        run: nix develop --command just nginx-smoke-test

  docs-build-test:
    name: Docs Build Test
    needs: [changes]
    if: |
      needs.changes.result == 'success' &&
      needs.changes.outputs.automation_skip == 'false' &&
      needs.changes.outputs.only_workflows == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Lint documentation
        run: nix develop --command just docs-lint
      - name: Build documentation
        run: nix develop --command just docs-build
