name: Publish from branch

on: workflow_dispatch
jobs:
  publish-from-branch:
    name: Publish from branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gets additionally all tags which we need
      - uses: DeterminateSystems/determinate-nix-action@v3
      - id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      # crane and oci_push read the credentials it writes to ~/.docker/config.json.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - env:
          BAZEL_FLAGS: ${{ steps.rbe.outputs.flags }} --lockfile_mode=error --build_event_json_file=${{ runner.temp }}/bep-publish.json
        run: nix develop --command just docker-publish
      - name: Upload the build event logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-publish
          path: ${{ runner.temp }}/bep-*.json
          if-no-files-found: ignore
