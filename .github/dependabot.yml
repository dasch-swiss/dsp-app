# ─── Update strategy overview ──────────────────────────────────────────────────
#
# Automated version updates are off: Renovate is disabled in renovate.json and
# library updates are made by hand.
#
# The npm entry below is kept solely so that Dependabot security update PRs
# inherit the labels config. open-pull-requests-limit: 0 disables version
# update PRs for npm; security update PRs are unaffected by the limit and will
# receive the "security" label.
# ───────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"
